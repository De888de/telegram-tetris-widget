<style>
  body{margin:0;background:#111;color:white;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}
  #menu{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(17,17,17,0.98);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:20px;text-align:center}
  .logo{font-size:32px;font-weight:900;letter-spacing:2px;margin-bottom:20px;color:#31e08a;text-shadow:0 0 10px #31e08a}
  .rules{font-size:14px;line-height:1.6;max-width:320px;text-align:left;background:#1e1e1e;padding:15px;border-radius:10px;border:1px solid #333}
  .rules span{color:#ff4444;font-weight:bold}
  .rules .magic{color:#ffcc00;font-weight:bold}
  .rules .poison{color:#00ff00;font-weight:bold}
  .btn{margin-top:25px;padding:12px 30px;font-size:18px;background:#31e08a;color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:bold;box-shadow:0 4px 0 #1a7a4a}
  .btn:active{transform:translateY(4px);box-shadow:none}
  #board{display:grid;grid-template-columns:repeat(15,20px);grid-template-rows:repeat(15,20px);gap:1px;background:#222;padding:2px;border:2px solid #333}
  .cell{width:20px;height:20px;background:#111}
  .snake{background:#31e08a;border-radius:2px}
  .head{background:#00f0f0;border-radius:50%}
  .food{background:#ff4444;border-radius:50%;animation:pulse 0.5s infinite alternate}
  .magic{background:#ffcc00;border-radius:50%;box-shadow:0 0 10px #ffcc00;animation:pulse 0.5s infinite alternate}
  .poison{background:#00ff00;border-radius:50%;box-shadow:0 0 10px #00ff00;animation:pulse 0.3s infinite alternate}
  @keyframes pulse{from{opacity:0.6}to{opacity:1}}
  .controls{margin-top:15px;display:grid;grid-template-columns:repeat(3,50px);gap:5px}
  button.ctrl-btn{padding:10px;font-size:1.2em;background:#232e3c;color:white;border:1px solid #444;border-radius:5px;cursor:pointer}
  button.ctrl-btn:active{background:#007bff}
  .empty{visibility:hidden}
  #score{font-size:20px;font-weight:bold;margin-bottom:10px;color:#31e08a}
  #game-over{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);flex-direction:column;align-items:center;justify-content:center;z-index:10}
  #game-over h2{color:#ff4444;margin-bottom:10px}
  #game-over button{padding:10px 20px;font-size:16px;background:#007bff;border:none;border-radius:5px;color:white;cursor:pointer}
</style>

<div id="menu">
  <div class="logo">ЗМЕЙКА</div>
  <div class="rules">
    <b>📜 ПРАВИЛА:</b><br><br>
    🐍 Управляйте змейкой кнопками.<br>
    🍎 Собирайте <span>красную еду</span> (очки и рост).<br>
    🌟 <span class="magic">Волшебное яблоко</span> — сбрасывает скорость (появляется каждые 7-8 яблок).<br>
    ☠️ <span class="poison">Отравленное яблоко</span> — ускоряет на 15 секунд!<br><br>
    💀 Не врезайтесь в стены и хвост!
  </div>
  <button class="btn" id="start">Вперёд!</button>
</div>

<div id="score">Очки: 0</div>
<div id="board"></div>
<div class="controls">
  <button class="empty"></button>
  <button class="ctrl-btn" id="up">↑</button>
  <button class="empty"></button>
  <button class="ctrl-btn" id="left">←</button>
  <button class="ctrl-btn" id="down">↓</button>
  <button class="ctrl-btn" id="right">→</button>
</div>

<div id="game-over">
  <h2>Игра окончена!</h2>
  <p>Ваш результат: <span id="final-score">0</span></p>
  <button id="restart">Попробовать снова</button>
</div>

<script>
  const W = window.TelegramWidget;
  const SIZE = 15;
  const boardEl = document.getElementById('board');
  let cells = [];
  let snake = [{x: 7, y: 7}];
  let dir = {x: 1, y: 0};
  let nextDir = {x: 1, y: 0};
  
  // Еда и спец-яблоки
  let food = {x: 10, y: 10};
  let magicFood = null;
  let poisonFood = null;
  
  let score = 0;
  let appleCount = 0;
  let gameLoop = null;
  let isGameOver = false;
  let gameActive = false;
  let poisonedUntil = 0;

  // Создаем сетку
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const c = document.createElement('div');
      c.className = 'cell';
      c.id = `c-${x}-${y}`;
      boardEl.appendChild(c);
      cells.push({x, y, el: c});
    }
  }

  function generateFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y) || 
             (magicFood && magicFood.x === pos.x && magicFood.y === pos.y) ||
             (poisonFood && poisonFood.x === pos.x && poisonFood.y === pos.y));
    food = pos;
  }

  function generateMagicFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y) || 
             (food && food.x === pos.x && food.y === pos.y) ||
             (poisonFood && poisonFood.x === pos.x && poisonFood.y === pos.y));
    magicFood = pos;
  }

  function generatePoisonFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y) || 
             (food && food.x === pos.x && food.y === pos.y) ||
             (magicFood && magicFood.x === pos.x && magicFood.y === pos.y));
    poisonFood = pos;
  }

  function draw() {
    cells.forEach(c => c.el.className = 'cell');
    
    // Еда
    document.getElementById(`c-${food.x}-${food.y}`).className = 'cell food';
    
    // Волшебное яблоко
    if (magicFood) document.getElementById(`c-${magicFood.x}-${magicFood.y}`).className = 'cell magic';
    
    // Отравленное яблоко
    if (poisonFood) document.getElementById(`c-${poisonFood.x}-${poisonFood.y}`).className = 'cell poison';

    // Змейка
    snake.forEach((s, i) => {
      const el = document.getElementById(`c-${s.x}-${s.y}`);
      if (el) {
        el.className = 'cell ' + (i === 0 ? 'head' : 'snake');
      }
    });
  }

  function move() {
    if (isGameOver || !gameActive) return;
    
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) {
      return endGame();
    }
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    // Поедание обычной еды
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      appleCount++;
      document.getElementById('score').textContent = 'Очки: ' + score;
      
      // Каждое 7-8 яблоко — спавним волшебное
      if (appleCount % Math.floor(7 + Math.random() * 2) === 0) {
        generateMagicFood();
      }
      
      // Отравленное появляется случайно (шанс 20%)
      if (Math.random() < 0.2 && !poisonFood) {
        generatePoisonFood();
      }

      generateFood();
      
      // Перезапуск таймера с новой скоростью
      clearInterval(gameLoop);
      startLoop();
    } 
    // Поедание волшебного яблока
    else if (magicFood && head.x === magicFood.x && head.y === magicFood.y) {
      magicFood = null;
      score += 5;
      document.getElementById('score').textContent = 'Очки: ' + score;
      
      // СБРОС СКОРОСТИ (но не ниже базовой)
      clearInterval(gameLoop);
      // Временно делаем скорость очень медленной
      const normalSpeed = Math.max(150, 300 - score);
      gameLoop = setInterval(move, normalSpeed);
    }
    // Поедание отравленного яблока
    else if (poisonFood && head.x === poisonFood.x && head.y === poisonFood.y) {
      poisonFood = null;
      poisonedUntil = Date.now() + 15000; // 15 секунд
      clearInterval(gameLoop);
      // Ускорение: интервал становится очень маленьким
      gameLoop = setInterval(move, Math.max(50, 150 - score));
    } 
    else {
      snake.pop();
    }

    draw();
  }

  function startLoop() {
    let speed;
    if (Date.now() < poisonedUntil) {
      // Если отравлены - бешеная скорость
      speed = Math.max(50, 150 - score);
    } else {
      // Обычная скорость
      speed = Math.max(100, 300 - score);
    }
    gameLoop = setInterval(move, speed);
  }

  function endGame() {
    isGameOver = true;
    clearInterval(gameLoop);
    document.getElementById('final-score').textContent = score;
    document.getElementById('game-over').style.display = 'flex';
  }

  function restart() {
    snake = [{x: 7, y: 7}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    appleCount = 0;
    isGameOver = false;
    gameActive = true;
    magicFood = null;
    poisonFood = null;
    poisonedUntil = 0;
    document.getElementById('score').textContent = 'Очки: 0';
    document.getElementById('game-over').style.display = 'none';
    generateFood();
    draw();
    clearInterval(gameLoop);
    startLoop();
  }

  // Управление
  document.getElementById('up').onclick = () => { if (dir.y === 0) nextDir = {x: 0, y: -1}; };
  document.getElementById('down').onclick = () => { if (dir.y === 0) nextDir = {x: 0, y: 1}; };
  document.getElementById('left').onclick = () => { if (dir.x === 0) nextDir = {x: -1, y: 0}; };
  document.getElementById('right').onclick = () => { if (dir.x === 0) nextDir = {x: 1, y: 0}; };
  document.getElementById('restart').onclick = restart;

  document.getElementById('start').onclick = () => {
    document.getElementById('menu').style.display = 'none';
    gameActive = true;
    generateFood();
    draw();
    startLoop();
  };
</script>
